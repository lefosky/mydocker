name: Sync Docker Image to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      image:
        description: '需要同步的镜像 (例如: nginx:latest 或 bitnami/redis:7.0)'
        required: true
        type: string

env:
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com # 替换成你的地域地址
  ALIYUN_NAMESPACE: my-docker-sync                   # 替换成你的命名空间

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync image via Skopeo
        env:
          DEST_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          DEST_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          SRC_IMAGE="${{ github.event.inputs.image }}"
          
          # 处理镜像名：如果带斜杠（如 bitnami/redis:7.0），可以把斜杠替换成横杠，因为阿里云命名空间下不支持多级目录
          IMAGE_NAME=$(echo "$SRC_IMAGE" | sed 's/\//-/g')
          
          DEST_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}"
          
          echo "Syncing docker://${SRC_IMAGE} -> docker://${DEST_IMAGE}"
          
          skopeo copy --insecure-policy \
            --dest-creds "${DEST_USER}:${DEST_PASS}" \
            "docker://${SRC_IMAGE}" \
            "docker://${DEST_IMAGE}"
            
          echo "✅ 同步完成！国内拉取命令："
          echo "docker pull ${DEST_IMAGE}"
